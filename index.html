
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anu's Jewel World</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="hero">

        <!-- Animated background -->
        <div class="background-slides">
            <div class="background-slide active"
                 style="background-image: url('assets/images/jewellery1.jpg');">
            </div>

            <div class="background-slide"
                 style="background-image: url('assets/images/jewellery2.jpg');">
            </div>

            <div class="background-slide"
                 style="background-image: url('assets/images/jewellery3.jpg');">
            </div>
        </div>

        <!-- Dark overlay -->
        <div class="hero-overlay"></div>

        <!-- Navigation -->
        <header class="header">
            <nav class="navbar navbar-expand-lg">

                <a href="#" class="brand">
                    <img
                        src="assets/images/logo.png"
                        alt="Anu's Jewel World"
                        class="brand-logo"
                    >
                    <span class="brand-name">Anu's Jewel World</span>
                </a>

                <button
                    class="navbar-toggler menu-toggle"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNav"
                    aria-label="Toggle navigation"
                >
                    <i class="bi bi-list"></i>
                </button>

                <div class="collapse navbar-collapse" id="mainNav">

                    <ul class="navbar-nav navigation-links">
                        <li class="nav-item">
                            <a class="nav-link" href="#about">About us</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#collections">Collections</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#arrivals">New Arrivals</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#bridal">Bridal Jewellery</a>
                        </li>
                    </ul>

                    <a href="#contact" class="contact-button">
                        <i class="bi bi-arrow-up-right"></i>
                        Contact
                    </a>

                </div>
            </nav>
        </header>

        <!-- Jewellery thumbnails -->
        <div class="thumbnail-gallery">

            <button class="thumbnail active" data-slide="0"
                    aria-label="Show first jewellery image">
                <img src="assets/images/jewellery1.jpg" alt="Gold jewellery">
            </button>

            <button class="thumbnail" data-slide="1"
                    aria-label="Show second jewellery image">
                <img src="assets/images/jewellery2.jpg" alt="Diamond jewellery">
            </button>

            <button class="thumbnail" data-slide="2"
                    aria-label="Show third jewellery image">
                <img src="assets/images/jewellery3.jpg" alt="Bridal jewellery">
            </button>

        </div>

        <!-- Hero content -->
        <section class="hero-content">
            <p class="eyebrow">ANU'S JEWEL WORLD</p>

            <h1>Jewellery Made for Every Mood</h1>

            <p class="hero-description">
                Every gem tells your story.
            </p>

            <a href="#collections" class="explore-button">
                Explore Collections
                <i class="bi bi-arrow-right"></i>
            </a>
        </section>

        <div class="slide-counter">
            <span id="current-slide">01</span>
            <span class="counter-line"></span>
            <span>03</span>
        </div>

    </main>

    <!-- Add your remaining website sections below this point -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
